<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-visual">
<meta name="robots" content="noindex">
<title>Tablero Hockey — Ingresar</title>
<style>
:root{--bg:#0F172A;--surf:#1E293B;--surf2:#273549;--border:#475569;--accent:#6366F1;--accent-t:#818CF8;--red:#EF4444;--white:#F8FAFC;--muted:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(99,102,241,.1),transparent 55%),var(--bg);color:var(--white);font-family:system-ui,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:360px;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:28px 24px;box-shadow:0 0 60px rgba(0,0,0,.7)}
h1{font-size:1.1rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent-t);text-align:center;margin-bottom:6px}
p.sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:22px}
label{display:block;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 5px;font-weight:600}
input{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:7px;color:var(--white);font-size:1.05rem;padding:11px 12px;outline:none;margin-bottom:14px}
input:focus{border-color:var(--accent)}
button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:13px;font-size:.9rem;font-weight:700;letter-spacing:3px;cursor:pointer;margin-top:4px}
button:disabled{opacity:.5}
#err{color:var(--red);font-size:.85rem;text-align:center;min-height:1.2em;margin-top:12px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
<h1>Tablero Hockey</h1>
<p class="sub">Ingresá con tu usuario</p>
<label for="u">Usuario</label>
<input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
<label for="p">Clave</label>
<input id="p" name="password" type="password" autocomplete="current-password" required>
<button id="b" type="submit">INGRESAR</button>
<div id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var b=document.getElementById('b'), err=document.getElementById('err');
  b.disabled=true; err.textContent='';
  try{
    var r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({user:document.getElementById('u').value,password:document.getElementById('p').value})});
    var d=await r.json();
    if(r.ok){ try{document.activeElement.blur();}catch(e){} setTimeout(function(){ location.href='/'; },450); return; }
    err.textContent=d.error||'No se pudo ingresar';
  }catch(x){ err.textContent='Sin conexión. Intentá de nuevo.'; }
  b.disabled=false;
});
</script>
</body>
</html>
