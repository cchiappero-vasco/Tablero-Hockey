<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Tablero Hockey — Usuarios</title>
<style>
:root{--bg:#080b10;--surf:#0f1219;--surf2:#161b25;--border:#242c3d;--accent:#00d4ff;--red:#ff3060;--green:#00e676;--white:#eef2ff;--muted:#6a76a0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--white);font-family:system-ui,'Segoe UI',sans-serif;padding:18px 16px 40px}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
h1{font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
a.back{color:var(--accent);text-decoration:none;font-size:.85rem;font-weight:600}
.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{background:var(--surf2);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:.95rem;padding:9px 10px;outline:none;flex:1;min-width:120px}
input:focus,select:focus{border-color:var(--accent)}
button{border:none;border-radius:6px;padding:9px 14px;font-weight:700;font-size:.8rem;letter-spacing:1px;cursor:pointer;background:var(--accent);color:#000}
button.ghost{background:transparent;color:var(--white);border:1px solid var(--border)}
button.del{background:transparent;color:var(--red);border:1px solid var(--red)}
.u{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--border)}
.u:first-of-type{border-top:none}
.u .n{font-weight:700;flex:1;min-width:110px}
.badge{font-size:.65rem;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
.badge.admin{color:var(--accent);border-color:var(--accent)}
#msg{min-height:1.3em;font-size:.85rem;margin-bottom:10px}
#msg.ok{color:var(--green)}#msg.err{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Usuarios</h1><a class="back" href="/">← Volver al tablero</a></header>
<div id="msg"></div>
<div class="card">
<h2>Crear usuario</h2>
<div class="row">
<input id="nu" placeholder="Usuario" autocapitalize="none" autocomplete="off">
<input id="np" placeholder="Clave" autocomplete="off">
<select id="nr"><option value="common">Común (solo usa el tablero)</option><option value="admin">Administrador</option></select>
<button onclick="createUser()">CREAR</button>
</div>
</div>
<div class="card">
<h2>Usuarios existentes</h2>
<div id="list">Cargando…</div>
</div>
<div class="card">
<h2>Cambiar mi clave</h2>
<div class="row">
<input id="cp" type="password" placeholder="Clave actual" autocomplete="current-password">
<input id="cn" type="password" placeholder="Clave nueva" autocomplete="new-password">
<button class="ghost" onclick="changeMine()">CAMBIAR</button>
</div>
</div>
</div>
<script>
var me='';
function say(t,ok){var m=document.getElementById('msg');m.textContent=t;m.className=ok?'ok':'err';}
async function api(method,url,body){
  var r=await fetch(url,{method:method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  var d={};try{d=await r.json()}catch(e){}
  if(r.status===401){location.href='/login';throw 0}
  if(!r.ok){say(d.error||'Error',false);throw 0}
  return d;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function load(){
  var d=await api('GET','/api/users'); me=d.me;
  document.getElementById('list').innerHTML=d.users.map(function(u){
    return '<div class="u"><span class="n">'+esc(u.name)+'</span><span class="badge '+(u.role==='admin'?'admin':'')+'">'+(u.role==='admin'?'Admin':'Común')+'</span>'
     +'<button class="ghost" data-a="pw" data-k="'+esc(u.key)+'">Nueva clave</button>'
     +'<button class="ghost" data-a="role" data-k="'+esc(u.key)+'" data-r="'+u.role+'">'+(u.role==='admin'?'Pasar a común':'Hacer admin')+'</button>'
     +(u.key===me?'':'<button class="del" data-a="del" data-k="'+esc(u.key)+'">Borrar</button>')+'</div>';
  }).join('');
}
document.getElementById('list').addEventListener('click',async function(e){
  var b=e.target.closest('button'); if(!b) return;
  var k=b.dataset.k, a=b.dataset.a;
  try{
    if(a==='pw'){var p=prompt('Nueva clave para '+k+':'); if(!p) return; await api('PUT','/api/users',{user:k,password:p}); say('Clave actualizada',true);}
    if(a==='role'){await api('PUT','/api/users',{user:k,role:b.dataset.r==='admin'?'common':'admin'}); say('Rol actualizado',true);}
    if(a==='del'){if(!confirm('¿Borrar el usuario '+k+'?')) return; await api('DELETE','/api/users?user='+encodeURIComponent(k)); say('Usuario borrado',true);}
    load();
  }catch(x){}
});
async function createUser(){
  try{
    await api('POST','/api/users',{user:document.getElementById('nu').value,password:document.getElementById('np').value,role:document.getElementById('nr').value});
    say('Usuario creado',true);
    document.getElementById('nu').value='';document.getElementById('np').value='';
    load();
  }catch(x){}
}
async function changeMine(){
  try{
    await api('PUT','/api/me',{current:document.getElementById('cp').value,password:document.getElementById('cn').value});
    say('Tu clave fue cambiada',true);
    document.getElementById('cp').value='';document.getElementById('cn').value='';
  }catch(x){}
}
load();
</script>
</body>
</html>
